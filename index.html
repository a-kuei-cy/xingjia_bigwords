<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>興嘉國小｜大字展示工具</title>
<style>
:root{--ink:#183450;--muted:#647d93;--line:#d9e6f1;--blue:#1764b3;--cream:#fffaf0;--paper:#fff;--shadow:0 12px 32px #24446a14}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:var(--ink);background:#e9f2fa}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5b84b;outline-offset:2px}
.shell{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);min-height:100vh}.sidebar{background:linear-gradient(160deg,#fff,#f8fbff);padding:22px;box-shadow:5px 0 30px #2342;z-index:1;overflow:auto;max-height:100vh}.eyebrow{font-size:12px;letter-spacing:1.6px;font-weight:900;color:#3671b1}.brand{display:flex;gap:12px;align-items:center;margin:15px 0 4px}.brandIcon{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#2e8ccf,#50c6b3);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 7px 15px #1278b23d}h1{font-size:25px;line-height:1.25;margin:0}h2{font-size:16px;margin:22px 0 10px}.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:7px 0 15px}label{font-weight:800;font-size:14px;display:block;margin:10px 0 7px}textarea,select,input[type=number],input[type=text]{width:100%;border:1px solid #c6d7e8;border-radius:12px;padding:12px;background:#fff;color:var(--ink);min-width:0;font-size:16px}textarea{height:106px;resize:vertical}select{min-height:46px}.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.presets button{background:#e8f1fb;border:1px solid transparent;color:#17436b;border-radius:12px;padding:12px 5px;min-height:48px;font-weight:800;font-size:13px}.presets button:hover{border-color:#6cb3e5}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pair>div{min-width:0}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}.swatch{border:2px solid transparent;background:transparent;border-radius:12px;padding:5px 1px;color:var(--ink);font-size:10px;font-weight:800;min-width:0}.swatch span{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 5px;border-radius:7px;border:1px solid #b6c9db;font-size:14px}.swatch.active{border-color:#1267b7;background:#eaf4ff}.control{margin-top:10px}.slider{display:flex;align-items:center;gap:10px}.slider input{width:100%;accent-color:#1764b3}.slider output{min-width:45px;text-align:right;font-size:13px;font-weight:800}.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:13px 0}.check input{width:18px;height:18px;accent-color:#1764b3}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:12px;padding:11px 13px;min-height:46px;background:#e7f1fa;color:#164c79;font-weight:800}.btn.primary{background:#166bb9;color:white}.btn.green{background:#dff7e8;color:#17633e}.btn:disabled{opacity:.5;cursor:not-allowed}.previewSide{padding:20px;display:flex;flex-direction:column;min-width:0;min-height:100vh}.previewBar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:3px 2px 16px;color:#466987;font-weight:700;font-size:14px}.previewBar .buttons{margin:0}.display{flex:1;position:relative;overflow:hidden;border-radius:22px;min-height:420px;display:flex;align-items:center;justify-content:center;padding:30px;background:#fff0dc;color:#82400d;box-shadow:var(--shadow)}.display:fullscreen{border-radius:0;width:100vw;height:100vh;padding:3vw}.content{width:100%;max-height:100%;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;font-size:110px;font-weight:900;line-height:1.14;letter-spacing:.01em}.display.marquee{justify-content:flex-start}.display.marquee .content{white-space:pre;width:max-content;max-height:none;flex:none;overflow-wrap:normal;animation:marquee var(--duration,12s) linear infinite}.display.blink .content{animation:blink 1s steps(1,end) infinite}.display.marquee.blink .content{animation:marquee var(--duration,12s) linear infinite,blink 1s steps(1,end) infinite}@keyframes marquee{from{transform:translateX(var(--start,1000px))}to{transform:translateX(var(--end,-1000px))}}@keyframes blink{50%{visibility:hidden}}.timerOnly{display:none;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1}.display.timer .content,.display.clock .content{display:none}.display.timer .timerOnly,.display.clock .timerOnly{display:block}.display.timer .content,.display.clock .content{animation:none}.status{font-size:13px;color:#607b92;margin:10px 0 0}.timeControls{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.timeControls input{width:90px}.timeControls label{margin-top:0}.footer{font-size:12px;color:#67849c;text-align:center;margin-top:14px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{max-height:none}.previewSide{min-height:65vh;padding:12px}.display{min-height:360px}.palette{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:480px){.sidebar{padding:15px}.previewBar{align-items:flex-start}.previewSide{min-height:55vh}.display{min-height:260px;padding:15px}.palette{grid-template-columns:repeat(5,minmax(0,1fr))}.brand h1{font-size:22px}.buttons .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){.display.blink .content{animation-duration:2s}}
</style></head><body><div class="shell"><aside class="sidebar">
<div class="eyebrow">XINGJIA ELEMENTARY SCHOOL · BIG WORDS</div><div class="brand"><div class="brandIcon">📣</div><h1>興嘉國小<br>大字展示工具</h1></div><p class="hint">一輸入就能展示的大字電子告示牌，適合教室、集會與活動投影。</p>
<label for="message">要顯示的文字</label><textarea id="message" placeholder="例如：歡迎蒞臨興嘉國小">請輸入文字</textarea><p class="hint">每行文字將換行展示；也可使用下方範本快速套用。</p>
<h2>快速套用常用範本</h2><div class="presets" id="presets"><button data-text="歡迎蒞臨興嘉國小">歡迎蒞臨</button><button data-text="活動即將開始">活動開始</button><button data-text="會議進行中">會議進行中</button><button data-text="請保持安靜">請保持安靜</button><button data-text="休息時間">休息時間</button><button data-text="暫停服務">暫停服務</button></div>
<h2>展示設定</h2><div class="pair"><div><label for="theme">顯示配色</label><select id="theme"></select></div><div><label for="mode">顯示模式</label><select id="mode"><option value="text">大型文字</option><option value="timer">倒數計時</option><option value="clock">目前時間</option></select></div></div><div class="palette" id="palette"></div>
<div class="pair"><div><label for="effect">文字效果</label><select id="effect"><option value="static">靜態文字</option><option value="marquee">跑馬燈</option><option value="blink">閃爍</option><option value="both">跑馬燈＋閃爍</option></select></div><div><label for="speed">跑馬燈速度</label><select id="speed"><option value="20">慢速</option><option value="12" selected>一般</option><option value="6">快速</option></select></div></div>
<div class="control"><label for="size">文字大小 <output id="sizeOut">110px</output></label><div class="slider"><input id="size" type="range" min="24" max="260" value="110"><button class="btn" id="minus" aria-label="縮小文字">A−</button><button class="btn" id="plus" aria-label="放大文字">A+</button></div></div>
<label class="check"><input type="checkbox" id="fit" checked>全螢幕自動縮放文字</label>
<div class="pair"><div><label for="fg">自訂文字顏色</label><input type="color" id="fg" value="#82400d" style="width:100%;height:45px"></div><div><label for="bg">自訂背景顏色</label><input type="color" id="bg" value="#fff0dc" style="width:100%;height:45px"></div></div>
<h2>倒數計時控制</h2><div class="timeControls"><div><label for="minutes">分鐘</label><input type="number" id="minutes" min="0" max="999" value="5"></div><div><label for="seconds">秒數</label><input type="number" id="seconds" min="0" max="59" value="0"></div><button class="btn green" id="start">▶ 開始</button><button class="btn" id="pause">暫停／繼續</button><button class="btn" id="timerReset">重設</button></div><p class="status" id="status" role="status">倒數尚未開始</p>
<h2>投影與輸出</h2><div class="buttons"><button class="btn primary" id="fullscreen">⛶ 全螢幕展示</button><button class="btn" id="download">⬇ 下載圖片</button><button class="btn" id="reset">↺ 還原設定</button></div>
<div class="footer">興嘉國小 · 教學現場友善工具 · 離線可用</div>
</aside><main class="previewSide"><div class="previewBar"><span>即時預覽｜選擇模式後可直接投影播放</span><div class="buttons"><button class="btn primary" id="full2">⛶ 投影播放</button></div></div><div id="stage" class="display"><div id="words" class="content">請輸入文字</div><div id="timeView" class="timerOnly"></div></div></main></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const themes=[['黑底白字','#ffffff','#111827'],['白底黑字','#17263d','#ffffff'],['教育藍','#ffffff','#1758a5'],['溫暖橘','#82400d','#fff0dc'],['活潑綠','#155c3d','#dcfce7'],['典雅紫','#ffffff','#59408b'],['深夜藍','#ffffff','#0b2a4b'],['粉筆綠','#ffffff','#145443'],['柔和粉','#8d365a','#ffebf3'],['灰白簡報','#263b52','#f0f4f8'],['自訂','#82400d','#fff0dc']];
const ids=['message','theme','mode','effect','speed','size','fit','fg','bg','minutes','seconds'];
const defaults={message:'請輸入文字',theme:'3',mode:'text',effect:'static',speed:'12',size:'110',fit:true,fg:'#82400d',bg:'#fff0dc',minutes:'5',seconds:'0'};
let remaining=300,deadline=0,tickId=null,running=false,completed=false;
function stop(){if(tickId!==null){clearInterval(tickId);tickId=null;}running=false;}
function configured(){return Math.max(0,Math.min(999,Math.floor(Number($('minutes').value)||0)))*60+Math.max(0,Math.min(59,Math.floor(Number($('seconds').value)||0)));}
function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function clockText(){return new Date().toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function value(){const r={};for(const id of ids)r[id]=id==='fit'?$(id).checked:$(id).value;return r;}
function persist(){try{localStorage.setItem('xingjia-bigwords-b',JSON.stringify(value()));}catch(e){}}
function fitText(){const s=$('stage'),w=$('words'),v=$('timeView'),mode=$('mode').value,full=document.fullscreenElement===s;
if(mode!=='text'){v.style.fontSize=Math.max(24,Math.floor(Math.min(s.clientWidth*.22,s.clientHeight*.65)))+'px';return;}
w.style.fontSize=$('size').value+'px';
if(full&&$('fit').checked&&!['marquee','both'].includes($('effect').value)){
let z=Math.min(450,Math.floor(s.clientHeight*.85));for(;z>18;z-=2){w.style.fontSize=z+'px';if(w.scrollWidth<=s.clientWidth*.90&&w.scrollHeight<=s.clientHeight*.90)break;}
}
if(['marquee','both'].includes($('effect').value)){const sw=s.clientWidth,tw=w.scrollWidth;s.style.setProperty('--start',sw+'px');s.style.setProperty('--end',-tw+'px');s.style.setProperty('--duration',Math.max(3,Number($('speed').value)*(sw+tw)/Math.max(sw,1))+'s');}}
function updateTime(){const mode=$('mode').value;$('timeView').textContent=mode==='clock'?clockText():format(remaining);$('status').textContent=completed?'時間到！':running?'倒數進行中…':'倒數已暫停／尚未開始';fitText();}
function render(){const mode=$('mode').value,eff=$('effect').value,s=$('stage'),w=$('words');s.classList.toggle('timer',mode==='timer');s.classList.toggle('clock',mode==='clock');s.classList.toggle('marquee',mode==='text'&&['marquee','both'].includes(eff));s.classList.toggle('blink',mode==='text'&&['blink','both'].includes(eff));w.textContent=$('message').value||' ';w.style.color=$('fg').value;w.style.textAlign='center';s.style.background=$('bg').value;$('timeView').style.color=$('fg').value;$('sizeOut').textContent=$('size').value+'px';document.querySelectorAll('.swatch').forEach((el,i)=>el.classList.toggle('active',String(i)===$('theme').value));updateTime();persist();}
function setTheme(n){$('theme').value=String(n);$('fg').value=themes[n][1];$('bg').value=themes[n][2];render();}
themes.forEach((t,i)=>{const opt=document.createElement('option');opt.value=String(i);opt.textContent=t[0];$('theme').append(opt);const b=document.createElement('button');b.className='swatch';b.type='button';b.setAttribute('aria-label','配色：'+t[0]);const sp=document.createElement('span');sp.textContent='Aa';sp.style.background=t[2];sp.style.color=t[1];b.append(sp,document.createTextNode(t[0]));b.onclick=()=>setTheme(i);$('palette').append(b);});
$('theme').onchange=()=>setTheme(Number($('theme').value));
$('presets').addEventListener('click',e=>{const b=e.target.closest('button[data-text]');if(b){$('message').value=b.dataset.text;$('mode').value='text';render();}});
ids.forEach(id=>{if(id==='theme')return;$(id).addEventListener('input',()=>{if(id==='fg'||id==='bg')$('theme').value='10';if((id==='minutes'||id==='seconds')&&!running){remaining=configured();completed=false;}if(id==='mode'&&$('mode').value==='timer'&&!running&&!completed)remaining=configured();render();});});
$('plus').onclick=()=>{$('size').value=Math.min(260,Number($('size').value)+10);render();};$('minus').onclick=()=>{$('size').value=Math.max(24,Number($('size').value)-10);render();};
function tick(){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining===0){stop();completed=true;}updateTime();}
$('start').onclick=()=>{if(running)return;if(remaining===0||completed)remaining=configured();if(remaining<=0){$('status').textContent='請設定大於 0 的倒數時間';return;}$('mode').value='timer';completed=false;running=true;deadline=Date.now()+remaining*1000;stop();running=true;tickId=setInterval(tick,250);render();};
$('pause').onclick=()=>{if($('mode').value!=='timer')return;if(running){tick();stop();}else if(remaining>0){running=true;deadline=Date.now()+remaining*1000;tickId=setInterval(tick,250);}render();};
$('timerReset').onclick=()=>{stop();remaining=configured();completed=false;$('mode').value='timer';render();};
function fullscreen(){const s=$('stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(s.requestFullscreen)s.requestFullscreen();else alert('目前瀏覽器不支援全螢幕');}catch(e){alert('無法進入全螢幕');}}
$('fullscreen').onclick=fullscreen;$('full2').onclick=fullscreen;
$('reset').onclick=()=>{stop();for(const [id,v] of Object.entries(defaults)){if(id==='fit')$(id).checked=v;else $(id).value=v;}remaining=300;completed=false;render();};
$('download').onclick=()=>{const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d'),mode=$('mode').value,txt=mode==='text'?$('message').value:mode==='clock'?clockText():format(remaining);x.fillStyle=$('bg').value;x.fillRect(0,0,1920,1080);x.fillStyle=$('fg').value;x.textAlign='center';x.textBaseline='middle';let size=mode==='text'?Math.max(36,Number($('size').value)*2):360;const lines=[];for(const raw of txt.split('\n')){let line='';x.font='900 '+size+'px sans-serif';for(const ch of raw){if(x.measureText(line+ch).width>1730&&line){lines.push(line);line=ch;}else line+=ch;}lines.push(line);}while(size>24&&(lines.length*size*1.18>960||lines.some(t=>{x.font='900 '+size+'px sans-serif';return x.measureText(t).width>1730;})))size-=2;x.font='900 '+size+'px sans-serif';lines.forEach((line,i)=>x.fillText(line,960,540+(i-(lines.length-1)/2)*size*1.18,1730));const a=document.createElement('a');a.download='xingjia-bigwords.png';a.href=c.toDataURL('image/png');a.click();};
try{const saved=JSON.parse(localStorage.getItem('xingjia-bigwords-b')||'null');if(saved)for(const [id,v] of Object.entries(saved)){if(ids.includes(id)){if(id==='fit')$(id).checked=!!v;else $(id).value=String(v);}}}catch(e){}
remaining=configured();render();setInterval(()=>{if($('mode').value==='clock')updateTime();},1000);document.addEventListener('fullscreenchange',fitText);window.addEventListener('resize',fitText);
})();
</script></body></html>
